name: Set up the project
description: Node for Vite+ and tsx, pnpm at the version package.json pins, and the dependencies installed.

runs:
  using: composite
  steps:
    # With no version given, it installs the one `packageManager` names.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - run: pnpm install --frozen-lockfile
      shell: bash
    # The project's bins (`vp`, `tsx`, `wrangler`) for the steps that follow, as a script would have them.
    - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      shell: bash
