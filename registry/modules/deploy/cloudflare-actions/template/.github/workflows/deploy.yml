name: Deploy

# DISABLED: uncomment below when the secrets and the Cloudflare projects are ready, and put the name
# of this project's CI workflow where `CI` is.
# on:
#   workflow_run:
#     workflows: [CI]
#     types:
#       - completed
#     branches: [main]
on: workflow_dispatch

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Verify before deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The package manager's own: the project's `pm` module ships the action.
      - uses: ./.github/actions/setup
      - run: vp run check
      - run: vp run typecheck
      - run: vp run test
      # What would be deployed, planned from the tree: a config that cannot be deployed fails here,
      # before the job that holds the secrets starts.
      - run: vp run deploy:cloudflare --dry-run

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup
      # Builds every app, then migrates and deploys them. Which apps, and in what order, is
      # scripts/deploy-cloudflare.ts's to say: the workflow does not change when a module is added.
      - run: vp run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The environment's variables, as JSON: the script hands each build the ones Vite exposes.
          VARS_JSON: ${{ toJSON(vars) }}
