# A local Postgres for development: `vp run db:up` in packages/db. DATABASE_URL in .env.example points at it.
# Production uses an external Postgres: set DATABASE_URL to it, and do not run this file there.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
