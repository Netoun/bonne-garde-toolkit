name: Release

# Publishes `bonne-garde` to npm with npm trusted publishing: npm trusts this file of this repository,
# so no npm token is stored anywhere, and npm attaches provenance to the package.
on:
  push:
    tags: ["v*"]
  # A tag pushed before this workflow existed (v0.1.0) has no copy of it to run on its push.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The OIDC token npm exchanges for the right to publish.
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Trusted publishing needs npm ≥ 11.5.1: this Node ships npm 11.19.1.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # The packed CLI run under node, as `npx bonne-garde` runs it.
      - run: bun test scripts/pack-cli.test.ts
      - run: bun run pack:cli
      - name: The tag names the packed version
        run: |
          version="$(node -p 'require("./dist/npm/bonne-garde/package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not name the packed version $version"
            exit 1
          fi
      - run: npm publish
        working-directory: dist/npm/bonne-garde
