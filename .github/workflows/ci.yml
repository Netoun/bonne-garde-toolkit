name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The packed CLI is what runs under node (`npx`, `pnpm dlx`, `yarn dlx`): pack-cli's tests and
      # golden drive it with this one. It is the lowest 22 that vite-plus (`vp`, which verify and the
      # projects golden builds run) supports: `^22.18.0`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
      - run: bun install --frozen-lockfile
      - run: bun run verify
      # Golden installs its cloudflare project with pnpm, and Vite+ and tsx run on Node in every project.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # pm/pnpm's pin; pnpm runs the version a project's packageManager names in any case.
          version: 12.17.0
      - run: bun run golden
        env:
          # The image phases skip when docker is unavailable; in CI that has to fail the run.
          GOLDEN_REQUIRE_DOCKER: "1"
      # The packed package declares `engines.node >=22.12.0`: its own tests, once more, on exactly that.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      - run: bun test scripts/pack-cli.test.ts
