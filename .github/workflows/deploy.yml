name: Deploy

# DISABLED: uncomment below when secrets & Cloudflare projects are ready
# on:
#   workflow_run:
#     workflows: [CI]
#     types:
#       - completed
#     branches: [main]
on: workflow_dispatch

permissions:
  actions: read
  contents: read

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Run DB migrations
        run: bunx wrangler d1 migrations apply my-app-db --remote
        working-directory: apps/api

      - name: Deploy API to Workers
        run: bunx wrangler deploy --env production
        env:
          CLOUDFLARE_ENV: production
        working-directory: apps/api

  deploy-spa:
    name: Deploy SPA
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run --filter @acme/spa build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          CLOUDFLARE_ENV: production

      - name: Deploy SPA to Pages
        run: bunx wrangler pages deploy build/client --project-name my-app-spa --branch main
        env:
          CLOUDFLARE_ENV: production
        working-directory: apps/spa

  deploy-ssr:
    name: Deploy SSR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run --filter @acme/ssr build
        env:
          CLOUDFLARE_ENV: production

      - name: Deploy SSR to Workers
        run: bunx wrangler deploy --env production
        working-directory: apps/ssr
        env:
          CLOUDFLARE_ENV: production

  deploy-static:
    name: Deploy Static
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run --filter @acme/static build
        env:
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          CLOUDFLARE_ENV: production

      - name: Deploy Static to Pages
        run: bunx wrangler pages deploy build/client --project-name my-app-static --branch main
        working-directory: apps/static
