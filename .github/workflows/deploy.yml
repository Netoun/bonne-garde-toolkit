name: Deploy

# DISABLED: uncomment below when secrets & Cloudflare projects are ready
# on:
#   workflow_run:
#     workflows: [CI]
#     types:
#       - completed
#     branches: [main]
on: workflow_dispatch

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Verify before deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Run DB migrations
        run: bun run db:migrate:remote --env production
        working-directory: apps/api

      - name: Deploy API to Workers
        run: bun run deploy --env production
        env:
          CLOUDFLARE_ENV: production
        working-directory: apps/api

  deploy-spa:
    name: Deploy SPA
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run --filter @acme/spa build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          CLOUDFLARE_ENV: production

      - name: Deploy SPA to Pages
        run: bun run deploy --project-name my-app-spa --branch main
        env:
          CLOUDFLARE_ENV: production
        working-directory: apps/spa
